<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DA-1000 · 双通道功放电平表</title>
<style>
  :root{
    --page-1:#1b1f24; --page-2:#0a0b0d; --page-3:#050607;
    --amp-1:#3a4048; --amp-2:#262a2f; --amp-3:#1c1f23; --amp-4:#15181b;
    --amp-bd:#08090b;
    --amp-sh1:rgba(255,255,255,.06);
    --amp-sh2:rgba(0,0,0,.75);
    --amp-drop:rgba(0,0,0,.85);
    --head-1:rgba(255,255,255,.05); --head-2:rgba(255,255,255,0);
    --head-bd:rgba(0,0,0,.6);
    --panel-1:#0b0d0f; --panel-2:#101316;
    --panel-sh:rgba(0,0,0,.95);
    --panel-hl:rgba(255,255,255,.045);
    --panel2-1:#14171a; --panel2-2:#0f1214;
    --panel2-bd:rgba(0,0,0,.5);
    --panel2-sh:rgba(0,0,0,.6);
    --card-1:#0b0d0f; --card-2:#0e1113;
    --card-bd:#000;
    --card-sh:rgba(0,0,0,.7);
    --input-1:#0d1012; --input-2:#090b0d;
    --input-bd:#0a0c0e;
    --input-sh:rgba(0,0,0,.75);
    --sel-bg:#14171a;
    --sel-bg-2:#1c2024;
    --sys-1:#181c20; --sys-2:#0f1214;
    --sys-bd:rgba(0,0,0,.55);
    --sys-sh:rgba(0,0,0,.55);
    --mains-1:#0d1013; --mains-2:#090b0e;
    --mains-bd:rgba(0,0,0,.7);
    --mains-sh:rgba(0,0,0,.7);
    --mains-cell-1:#101418; --mains-cell-2:#0a0c0e;
    --energy-1:#0e1114; --energy-2:#0a0c0e;
    --energy-bd:rgba(0,0,0,.7);
    --energy-sh:rgba(0,0,0,.7);
    --kwh-1:#0c1a12; --kwh-2:#091410; --kwh-3:#0a0c0e;
    --kwh-bd:rgba(46,224,110,.20);
    --kwh-glow:rgba(46,224,110,.09);
    --avg-since-1:#0e1a14; --avg-since-2:#0a1010;
    --avg-since-bd:rgba(46,224,110,.22);
    --tx-1:#c9ced6;
    --tx-2:#98a1ab;
    --tx-3:#767e88;
    --tx-4:#5b636d;
    --tx-5:#4e565f;
    --tx-accent:#8fe8b0;
    --tx-accent-dim:#5a8070;
    --tx-blue:#8ca8c4;
    --divider:rgba(255,255,255,.06);
    --foot-1:rgba(255,255,255,.028);
    --foot-2:rgba(0,0,0,.15);
    --foot-bd:rgba(0,0,0,.55);
    --btn-1:#3b4149; --btn-2:#23272c;
    --btn-1h:#474e57; --btn-2h:#2a2f35;
    --btn-tx:#d3d9e0;
    --btn-bd:#000;
    --btn-sh-t:rgba(255,255,255,.13);
    --btn-pr-1:#2f6b45; --btn-pr-2:#1c4429;
    --btn-pr-1h:#37804f; --btn-pr-2h:#204e2f;
    --btn-pr-tx:#c6f5d8;
    --refresh-1:rgba(255,255,255,.025);
    --refresh-2:rgba(0,0,0,.2);
    --refresh-bd:rgba(0,0,0,.6);
    --theme-bg:rgba(255,255,255,.04);
    --theme-bg-h:rgba(255,255,255,.09);
    --theme-bd:rgba(255,255,255,.06);
    --theme-icon:#c9ced6;
    --icon-primary:#7c9ab8;
    --icon-secondary:#767e88;
    --led-blue-bg-1:#141d2b; --led-blue-bg-2:#0d1319;
    --led-green-bg-1:#13251b; --led-green-bg-2:#0d1712;
    --led-yellow-bg-1:#2a2414; --led-yellow-bg-2:#18150c;
    --led-amber-bg-1:#2a1f11; --led-amber-bg-2:#18120a;
    --led-orange-bg-1:#2b1a11; --led-orange-bg-2:#180f0a;
    --led-red-bg-1:#2b1517; --led-red-bg-2:#180d0f;
    --vu-face-1:#e8e4d6;
    --vu-face-2:#d8d2bc;
    --vu-face-bd:#0a0c0e;
    --vu-tick:#2a2a2a;
    --vu-tick-major:#111;
    --vu-scale-text:#1a1a1a;
    --vu-needle:#c82020;
    --vu-needle-shadow:rgba(0,0,0,.4);
    --vu-hub-1:#f0ede0;
    --vu-hub-2:#1a1a1a;
    --vu-arc-red:#c82020;
    --vu-chlabel:#1a1a1a;
  }

  body.light{
    --page-1:#eef1f5; --page-2:#dde2e9; --page-3:#cfd6de;
    --amp-1:#ffffff; --amp-2:#f4f6f9; --amp-3:#eaeef2; --amp-4:#e0e5eb;
    --amp-bd:#c4cbd3;
    --amp-sh1:rgba(255,255,255,.9);
    --amp-sh2:rgba(0,0,0,.08);
    --amp-drop:rgba(40,50,65,.18);
    --head-1:rgba(255,255,255,.65); --head-2:rgba(255,255,255,0);
    --head-bd:rgba(0,0,0,.08);
    --panel-1:#ffffff; --panel-2:#f4f6f9;
    --panel-sh:rgba(0,0,0,.06);
    --panel-hl:rgba(255,255,255,.9);
    --panel2-1:#f9fafc; --panel2-2:#eff2f6;
    --panel2-bd:rgba(0,0,0,.06);
    --panel2-sh:rgba(0,0,0,.06);
    --card-1:#ffffff; --card-2:#f4f6f9;
    --card-bd:rgba(0,0,0,.06);
    --card-sh:rgba(0,0,0,.06);
    --input-1:#fafbfc; --input-2:#eef1f5;
    --input-bd:#c4cbd3;
    --input-sh:rgba(0,0,0,.05);
    --sel-bg:#f4f6f9;
    --sel-bg-2:#ffffff;
    --sys-1:#f6f8fa; --sys-2:#e9edf2;
    --sys-bd:rgba(0,0,0,.07);
    --sys-sh:rgba(0,0,0,.05);
    --mains-1:#f6f8fa; --mains-2:#e9edf2;
    --mains-bd:rgba(0,0,0,.08);
    --mains-sh:rgba(0,0,0,.05);
    --mains-cell-1:#ffffff; --mains-cell-2:#f2f4f8;
    --energy-1:#f6f8fa; --energy-2:#e9edf2;
    --energy-bd:rgba(0,0,0,.08);
    --energy-sh:rgba(0,0,0,.05);
    --kwh-1:#e6f7ed; --kwh-2:#dcf0e5; --kwh-3:#d2eadb;
    --kwh-bd:rgba(20,140,70,.25);
    --kwh-glow:rgba(20,140,70,.07);
    --avg-since-1:#e6f7ed; --avg-since-2:#dcf0e5;
    --avg-since-bd:rgba(20,140,70,.25);
    --tx-1:#2a3038;
    --tx-2:#4b5560;
    --tx-3:#5b636d;
    --tx-4:#767e88;
    --tx-5:#98a1ab;
    --tx-accent:#0d8040;
    --tx-accent-dim:#0a5a30;
    --tx-blue:#3a6d94;
    --divider:rgba(0,0,0,.07);
    --foot-1:rgba(255,255,255,.55);
    --foot-2:rgba(0,0,0,.025);
    --foot-bd:rgba(0,0,0,.08);
    --btn-1:#ffffff; --btn-2:#e8ecf1;
    --btn-1h:#f7f9fb; --btn-2h:#dde2e8;
    --btn-tx:#2a3038;
    --btn-bd:#c4cbd3;
    --btn-sh-t:rgba(255,255,255,.9);
    --btn-pr-1:#2f8a55; --btn-pr-2:#1c5a34;
    --btn-pr-1h:#37a065; --btn-pr-2h:#206b3d;
    --btn-pr-tx:#ffffff;
    --refresh-1:rgba(255,255,255,.7);
    --refresh-2:rgba(0,0,0,.03);
    --refresh-bd:#c4cbd3;
    --theme-bg:rgba(0,0,0,.035);
    --theme-bg-h:rgba(0,0,0,.08);
    --theme-bd:rgba(0,0,0,.08);
    --theme-icon:#5b636d;
    --icon-primary:#3a6d94;
    --icon-secondary:#5b636d;
    --led-blue-bg-1:#e6eef7; --led-blue-bg-2:#d6e2ef;
    --led-green-bg-1:#e1f1e7; --led-green-bg-2:#d0e6d8;
    --led-yellow-bg-1:#f7f1da; --led-yellow-bg-2:#ede4c4;
    --led-amber-bg-1:#f7ebda; --led-amber-bg-2:#eddcc4;
    --led-orange-bg-1:#f7e4da; --led-orange-bg-2:#edd0c4;
    --led-red-bg-1:#f7dcde; --led-red-bg-2:#edc8cb;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;
    background:radial-gradient(circle at 50% -10%,var(--page-1) 0%,var(--page-2) 60%,var(--page-3) 100%);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--tx-1);-webkit-font-smoothing:antialiased;
    padding:20px 12px;transition:background .35s ease,color .35s ease;
  }

  .amp{
    width:min(1000px,97vw);
    border-radius:16px;border:1px solid var(--amp-bd);
    background:linear-gradient(180deg,var(--amp-1) 0%,var(--amp-2) 6%,var(--amp-3) 55%,var(--amp-4) 100%);
    box-shadow:0 42px 90px var(--amp-drop),0 2px 0 var(--amp-sh1) inset,0 -2px 0 var(--amp-sh2) inset;
    position:relative;overflow:hidden;
    transition:background .35s ease,border-color .35s ease,box-shadow .35s ease;
  }
  .amp::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(90deg,rgba(127,127,127,.035) 0 1px, transparent 1px 3px);
  }
  .amp > *{position:relative;z-index:1}

  .amp-head{
    display:flex;align-items:center;gap:16px;padding:12px 22px;
    border-bottom:1px solid var(--head-bd);
    background:linear-gradient(180deg,var(--head-1),var(--head-2));
    transition:border-color .35s ease,background .35s ease;
  }
  .pwr{display:flex;align-items:center;gap:7px;font-size:9px;letter-spacing:.24em;color:var(--tx-4);font-weight:600}
  .pwr i{
    width:7px;height:7px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#b6ffcf,#25e06a 45%,#0a7a34);
    box-shadow:0 0 7px rgba(37,224,106,.9),0 0 18px rgba(37,224,106,.45);
    animation:breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
  .title{display:flex;align-items:baseline;gap:11px;min-width:0}
  .model{font-size:14px;font-weight:700;letter-spacing:.26em;color:var(--tx-1);text-shadow:0 1px 0 rgba(0,0,0,.15)}
  .desc{font-size:9px;letter-spacing:.2em;color:var(--tx-4);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand{margin-left:auto;font-size:9px;letter-spacing:.3em;color:var(--tx-5);font-weight:600}
  .theme-btn{
    order:-1;width:30px;height:30px;padding:0;border-radius:50%;
    border:1px solid var(--theme-bd);background:var(--theme-bg);color:var(--theme-icon);
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    transition:background .2s,border-color .2s,color .2s,transform .15s;
    font-family:inherit;flex:none;
  }
  .theme-btn:hover{background:var(--theme-bg-h);transform:rotate(15deg)}
  .theme-btn:active{transform:scale(.94)}
  .theme-btn svg{width:15px;height:15px;fill:none}
  .theme-btn .icon-moon{display:none}
  body.light .theme-btn .icon-moon{display:block}
  body.light .theme-btn .icon-sun{display:none}

  .icon{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.92}

  .meter-panel{
    margin:14px 18px 0;padding:14px 18px 12px;border-radius:11px;
    background:linear-gradient(180deg,var(--panel-1) 0%,var(--panel-2) 100%);
    box-shadow:inset 0 4px 16px var(--panel-sh),inset 0 -1px 0 var(--panel-hl),0 1px 0 var(--panel-hl);
    transition:background .35s ease,box-shadow .35s ease;
  }
  .meter-header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:0 0 9px;border-bottom:1px solid var(--divider);margin-bottom:10px;
  }
  .meter-title{display:flex;align-items:center;gap:10px}
  .meter-title .scale-tag{font-size:8.5px;letter-spacing:.24em;color:var(--tx-4);font-weight:600}
  .meter-title .meter-unit{font-size:8.5px;letter-spacing:.24em;color:var(--tx-4);font-weight:600}
  .meter-mode{
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 4px 3px 9px;height:26px;border-radius:6px;
    border:1px solid var(--refresh-bd);
    background:linear-gradient(180deg,var(--refresh-1),var(--refresh-2));
    box-shadow:inset 0 1px 0 var(--panel-hl);
  }
  .meter-mode-label{font-size:8.5px;font-weight:700;letter-spacing:.16em;color:var(--tx-3);text-transform:uppercase}
  .meter-mode-select{
    height:20px;padding:0 20px 0 8px;border-radius:4px;
    border:1px solid var(--input-bd);background-color:var(--sel-bg-2);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M1 1l3 3 3-3' fill='none' stroke='%2398a1ab' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 6px center;background-size:8px 5px;
    color:var(--tx-1);font-size:10.5px;font-family:inherit;letter-spacing:.04em;font-weight:600;
    cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;
    box-shadow:inset 0 1px 3px var(--input-sh);
    transition:color .15s,border-color .15s,background-color .35s;
  }
  .meter-mode-select:hover{border-color:var(--tx-5)}
  .meter-mode-select:focus{border-color:#3a5b7a;box-shadow:inset 0 1px 3px var(--input-sh),0 0 7px rgba(61,155,255,.4)}
  .meter-mode-select option{background:var(--sel-bg-2);color:var(--tx-1)}

  .led-view .grid3{display:grid;grid-template-columns:100px 1fr 70px;gap:14px;align-items:center}
  .led-view .scale-row{padding:0 0 9px;border-bottom:1px solid var(--divider);margin-bottom:10px}
  .led-view .scale-marks{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
  .led-view .scale-marks span{text-align:center;font-size:8.5px;letter-spacing:.06em;color:var(--tx-5);font-weight:600;font-variant-numeric:tabular-nums}
  .led-view .scale-marks span:last-child{color:#c16b65}

  .ch-row{padding:3px 0}
  .ch-label{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--tx-3)}
  .ch-label .side{
    display:inline-flex;align-items:center;justify-content:center;
    width:15px;height:15px;border-radius:3px;
    background:linear-gradient(180deg,var(--amp-2),var(--amp-4));
    border:1px solid var(--amp-bd);
    font-size:9px;letter-spacing:0;color:var(--tx-3);
    box-shadow:inset 0 1px 0 var(--amp-sh1);flex:none;
  }
  .ch-label.sub .band{color:var(--tx-blue)}
  .sep{height:1px;margin:8px 0;background:linear-gradient(90deg,transparent,var(--divider),transparent)}

  /* ===== LED 表头（本次修复重点）===== */
  .leds{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
  .led{
    position:relative;height:22px;border-radius:4px;overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.05),0 1px 0 var(--amp-sh1);
    transition:background 260ms ease-out, box-shadow 260ms ease-out;
    will-change:filter,box-shadow;
  }
  .led::after{
    content:"";position:absolute;left:0;right:0;top:0;height:52%;
    border-radius:4px 4px 0 0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,0));
    transition:background .25s ease-out;
  }

  .led[data-c="blue"]  {background:linear-gradient(180deg,var(--led-blue-bg-1),var(--led-blue-bg-2));--c:#3d9bff;--cd:#0a4a8c;--g:rgba(61,155,255,.55)}
  .led[data-c="green"] {background:linear-gradient(180deg,var(--led-green-bg-1),var(--led-green-bg-2));--c:#2ee06e;--cd:#0a6730;--g:rgba(46,224,110,.48)}
  .led[data-c="yellow"]{background:linear-gradient(180deg,var(--led-yellow-bg-1),var(--led-yellow-bg-2));--c:#f2d13a;--cd:#8a6f08;--g:rgba(242,209,58,.48)}
  .led[data-c="amber"] {background:linear-gradient(180deg,var(--led-amber-bg-1),var(--led-amber-bg-2));--c:#ff9d2e;--cd:#8a4c04;--g:rgba(255,157,46,.55)}
  .led[data-c="orange"]{background:linear-gradient(180deg,var(--led-orange-bg-1),var(--led-orange-bg-2));--c:#ff6a2b;--cd:#8c2c05;--g:rgba(255,106,43,.58)}
  .led[data-c="red"]   {background:linear-gradient(180deg,var(--led-red-bg-1),var(--led-red-bg-2));--c:#ff3b30;--cd:#8f0d06;--g:rgba(255,59,48,.65)}

  /* ★ 点亮：白色内核 + 多层彩色光晕 */
  .led.on{
    background:radial-gradient(ellipse 150% 130% at 50% 34%,
      #ffffff 0%, var(--c) 38%, var(--cd) 100%);
    box-shadow:
      0 0 4px #ffffff,
      0 0 10px var(--c),
      0 0 22px var(--g),
      0 0 44px var(--g),
      inset 0 1px 2px rgba(255,255,255,.85),
      inset 0 -1px 3px rgba(0,0,0,.35);
    transition:background 30ms linear, box-shadow 30ms linear;
  }
  .led.on::after{
    background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));
  }

  /* ★ LED 亮度脉冲动画：off→on 时触发一次过曝 */
  @keyframes ledPop {
    0%   {filter:brightness(2.4) saturate(1.6);}
    55%  {filter:brightness(1.15) saturate(1.05);}
    100% {filter:brightness(1) saturate(1);}
  }
  .led.pop{
    animation:ledPop 240ms ease-out;
  }

  .ch-db{text-align:right;font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--tx-3);transition:color .14s;letter-spacing:.02em}
  .ch-db.hot{color:#c8881a;text-shadow:0 0 10px rgba(255,208,90,.35)}
  .ch-db.clip{color:#d3392e;text-shadow:0 0 12px rgba(255,59,48,.45)}

  .vu-view{display:none;grid-template-columns:repeat(2,1fr);gap:14px;padding:4px 0}
  body.meter-vu .led-view{display:none}
  body.meter-vu .vu-view{display:grid}

  .vu-meter{
    display:flex;flex-direction:column;align-items:center;
    padding:10px 8px 8px;border-radius:8px;
    background:linear-gradient(180deg,var(--card-1),var(--card-2));
    border:1px solid var(--card-bd);
    box-shadow:inset 0 2px 8px var(--card-sh),0 1px 0 var(--panel-hl);
    transition:background .35s ease,border-color .35s ease,box-shadow .35s ease;
  }
  .vu-svg{width:100%;max-width:280px;height:auto;display:block}
  .vu-meta{
    display:flex;align-items:baseline;justify-content:space-between;
    width:100%;max-width:280px;margin-top:6px;padding-top:7px;
    border-top:1px solid var(--divider);
  }
  .vu-name{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--tx-3)}
  .vu-name.sub{color:var(--tx-blue)}
  .vu-readout{
    font-size:14px;font-weight:400;color:var(--tx-accent);
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
    transition:color .15s,text-shadow .15s;
  }
  .vu-readout small{font-size:8px;font-weight:500;color:var(--tx-4);margin-left:2px;letter-spacing:.06em}
  .vu-readout.hot{color:#c8881a;text-shadow:0 0 8px rgba(255,208,90,.3)}
  .vu-readout.clip{color:#d3392e;text-shadow:0 0 10px rgba(255,59,48,.5);animation:alertPulse 1.1s ease-in-out infinite}

  .control-panel{
    margin:12px 18px 0;padding:14px 18px 10px;border-radius:11px;
    background:linear-gradient(180deg,var(--panel2-1) 0%,var(--panel2-2) 100%);
    border:1px solid var(--panel2-bd);
    box-shadow:inset 0 2px 10px var(--panel2-sh),0 1px 0 var(--panel-hl);
    transition:background .35s ease,border-color .35s ease,box-shadow .35s ease;
  }
  .knobs-row{display:flex;align-items:flex-start;justify-content:center;gap:6px;flex-wrap:wrap}
  .knob-item{display:flex;flex-direction:column;align-items:center;width:88px;user-select:none}
  .knob-item + .knob-item{margin-left:2px}
  .knob-svg{width:76px;height:76px;cursor:grab;touch-action:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));transition:filter .15s}
  .knob-svg:hover{filter:drop-shadow(0 4px 8px rgba(0,0,0,.4)) brightness(1.08)}
  .knob-svg.dragging{cursor:grabbing}
  .knob-tick{stroke:var(--tx-5);stroke-width:1.4;stroke-linecap:round}
  .knob-tick.major{stroke:var(--tx-3);stroke-width:2}

function safeDt(v, max) {
  if (typeof v !== 'number' || !isFinite(v) || v < 0) return 0;
  return v > max ? max : v;
}
function safeK(dt, tau) {
  if (typeof dt !== 'number' || !isFinite(dt) || dt <= 0) return 0;
  if (typeof tau !== 'number' || !isFinite(tau) || tau <= 0) return 0;
  const k = 1 - Math.exp(-dt / tau);
  return isFinite(k) ? (k < 0 ? 0 : (k > 1 ? 1 : k)) : 0;
}
function safeNum(v, fallback) {
  return (typeof v === 'number' && isFinite(v)) ? v : fallback;
}
function safeVolt(v) {
  if (typeof v !== 'number' || !isFinite(v)) return MAINS_NOMINAL;
  if (v < MAINS_MIN - 20 || v > MAINS_MAX + 20) return MAINS_NOMINAL;
  return v;
}

  const saved = localStorage.getItem('da1000-theme');
  if (saved === 'light' || saved === 'dark') applyTheme(saved);
}catch(e){}

  const isLight = document.body.classList.toggle('light');
  try{ localStorage.setItem('da1000-theme', isLight ? 'light' : 'dark'); }catch(e){}
});

}

const mainsPhases = [
  { name:'L1', volt: MAINS_NOMINAL, loadBias: 1.00 },
  { name:'L2', volt: MAINS_NOMINAL, loadBias: 0.97 },
  { name:'L3', volt: MAINS_NOMINAL, loadBias: 1.03 },
];
const mainsAmps = [0, 0, 0];

function stepMainsVoltage(dt) {
  for (const p of mainsPhases) p.volt = safeVolt(p.volt);
  const stepScale = safeDt(dt, 1000) > 0 ? Math.sqrt(safeDt(dt, 1000) / 16.7) : 0;
  if (!isFinite(stepScale) || stepScale <= 0) return;
  for (const p of mainsPhases) {
    p.volt += (Math.random() - 0.5) * 0.22 * stepScale;
    p.volt += (MAINS_NOMINAL - p.volt) * 0.0018 * stepScale;
    p.volt = safeVolt(p.volt);
    if (p.volt < MAINS_MIN) p.volt = MAINS_MIN + Math.random() * 0.6;
    if (p.volt > MAINS_MAX) p.volt = MAINS_MAX - Math.random() * 0.6;
  }
}

function knobToDb(v) {
  if (v <= 0.5) return -40 + (v / 0.5) * 40;
  else          return ((v - 0.5) / 0.5) * 10;
}
function dbToKnob(dB) {
  dB = Math.max(-40, Math.min(10, dB));
  if (dB <= 0) return ((dB + 40) / 40) * 0.5;
  else         return 0.5 + (dB / 10) * 0.5;
}
function knobToGain(v) { return Math.pow(10, knobToDb(v) / 20); }
function fmtDb(dB) {
  if (Math.abs(dB) < 0.05) dB = 0;
  return (dB >= 0 ? '+' : '') + dB.toFixed(1);
}

function buildVUMeter(row) {
  const wrap = document.createElement('div');
  wrap.className = 'vu-meter';

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 200 130');
  svg.classList.add('vu-svg');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  const cx = 100, cy = 112, r = 72;
  const a0 = VU_START;
  const a1 = VU_START + VU_SWEEP;
  function polar(angleDeg, radius) {
    const rad = (angleDeg - 90) * Math.PI / 180;
    return [cx + radius * Math.cos(rad), cy + radius * Math.sin(rad)];
  }
  const [x0, y0] = polar(a0, r);
  const [x1, y1] = polar(a1, r);
  const faceD = `M ${x0} ${y0} A ${r} ${r} 0 0 1 ${x1} ${y1} L ${cx} ${cy} Z`;
  const face = document.createElementNS(svgNS, 'path');
  face.setAttribute('d', faceD);
  face.setAttribute('fill', 'url(#vuFaceGrad)');
  face.setAttribute('stroke', 'var(--vu-face-bd)');
  face.setAttribute('stroke-width', '1.5');
  svg.append(face);

  const redStartAng = VU_START + (0  - VU_MIN_DB) / (VU_MAX_DB - VU_MIN_DB) * VU_SWEEP;
  const redEndAng   = VU_START + VU_SWEEP;
  const [rx0, ry0] = polar(redStartAng, r);
  const [rx1, ry1] = polar(redEndAng, r);
  const arcRed = document.createElementNS(svgNS, 'path');
  arcRed.setAttribute('d', `M ${rx0} ${ry0} A ${r} ${r} 0 0 1 ${rx1} ${ry1}`);
  arcRed.setAttribute('fill', 'none');
  arcRed.setAttribute('stroke', 'var(--vu-arc-red)');
  arcRed.setAttribute('stroke-width', '2.2');
  arcRed.setAttribute('stroke-linecap', 'round');
  arcRed.setAttribute('opacity', '.75');
  svg.append(arcRed);

  const tickDefs = [
    { db: -40, label: '40' }, { db: -30, label: '30' }, { db: -20, label: '20' },
    { db: -12, label: '12' }, { db: -6,  label: '6'  }, { db: -3,  label: '3'  },
    { db:  0,  label: '0'  }, { db:  3,  label: '3'  }, { db:  6,  label: '6'  },
  ];
  for (const t of tickDefs) {
    const ang = VU_START + (t.db - VU_MIN_DB) / (VU_MAX_DB - VU_MIN_DB) * VU_SWEEP;
    const major = t.db === -12 || t.db === -6 || t.db === 0 || t.db === 6;
    const rIn  = major ? r - 10 : r - 6;
    const [tx0, ty0] = polar(ang, rIn);
    const [tx1, ty1] = polar(ang, r);
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', tx0); line.setAttribute('y1', ty0);
    line.setAttribute('x2', tx1); line.setAttribute('y2', ty1);
    line.setAttribute('stroke', major ? 'var(--vu-tick-major)' : 'var(--vu-tick)');
    line.setAttribute('stroke-width', major ? '1.6' : '0.8');
    line.setAttribute('stroke-linecap', 'round');
    svg.append(line);
    const [lx, ly] = polar(ang, r - 15);
    const text = document.createElementNS(svgNS, 'text');
    text.setAttribute('x', lx); text.setAttribute('y', ly);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('font-size', '7');
    text.setAttribute('font-family', 'inherit');
    text.setAttribute('fill', 'var(--vu-scale-text)');
    text.setAttribute('font-weight', '600');
    text.textContent = t.label;
    svg.append(text);
  }

  const vuAng = VU_START + (-12 - VU_MIN_DB) / (VU_MAX_DB - VU_MIN_DB) * VU_SWEEP;
  const [vx0, vy0] = polar(vuAng, r - 12);
  const [vx1, vy1] = polar(vuAng, r);
  const vuLine = document.createElementNS(svgNS, 'line');
  vuLine.setAttribute('x1', vx0); vuLine.setAttribute('y1', vy0);
  vuLine.setAttribute('x2', vx1); vuLine.setAttribute('y2', vy1);
  vuLine.setAttribute('stroke', 'var(--vu-arc-red)');
  vuLine.setAttribute('stroke-width', '2');
  vuLine.setAttribute('stroke-linecap', 'round');
  svg.append(vuLine);

  const needleG = document.createElementNS(svgNS, 'g');
  const needleShadow = document.createElementNS(svgNS, 'line');
  needleShadow.setAttribute('x1', cx + 1); needleShadow.setAttribute('y1', cy + 1);
  needleShadow.setAttribute('x2', cx + 1); needleShadow.setAttribute('y2', cy - 70);
  needleShadow.setAttribute('stroke', 'var(--vu-needle-shadow)');
  needleShadow.setAttribute('stroke-width', '2.6');
  needleShadow.setAttribute('stroke-linecap', 'round');
  needleShadow.setAttribute('opacity', '.5');
  needleG.append(needleShadow);

  const needle = document.createElementNS(svgNS, 'line');
  needle.setAttribute('x1', cx); needle.setAttribute('y1', cy);
  needle.setAttribute('x2', cx); needle.setAttribute('y2', cy - 74);
  needle.setAttribute('stroke', 'var(--vu-needle)');
  needle.setAttribute('stroke-width', '1.8');
  needle.setAttribute('stroke-linecap', 'round');
  needleG.append(needle);
  svg.append(needleG);

  const hub = document.createElementNS(svgNS, 'circle');
  hub.setAttribute('cx', cx); hub.setAttribute('cy', cy);
  hub.setAttribute('r', 7);
  hub.setAttribute('fill', 'url(#vuHubGrad)');
  hub.setAttribute('stroke', 'rgba(0,0,0,.6)');
  hub.setAttribute('stroke-width', '0.8');
  svg.append(hub);

  const hubInner = document.createElementNS(svgNS, 'circle');
  hubInner.setAttribute('cx', cx); hubInner.setAttribute('cy', cy);
  hubInner.setAttribute('r', 2);
  hubInner.setAttribute('fill', 'rgba(0,0,0,.6)');
  svg.append(hubInner);

  const chLabel = document.createElementNS(svgNS, 'text');
  chLabel.setAttribute('x', cx); chLabel.setAttribute('y', cy - 14);
  chLabel.setAttribute('text-anchor', 'middle');
  chLabel.setAttribute('font-size', '8');
  chLabel.setAttribute('font-family', 'inherit');
  chLabel.setAttribute('font-weight', '700');
  chLabel.setAttribute('letter-spacing', '1');
  chLabel.setAttribute('fill', 'var(--vu-chlabel)');
  chLabel.textContent = row.def.name + ' ' + row.def.side;
  svg.append(chLabel);

  wrap.append(svg);

  const meta = document.createElement('div');
  meta.className = 'vu-meta';
  const nameEl = document.createElement('div');
  nameEl.className = 'vu-name' + (row.def.sub ? ' sub' : '');
  nameEl.textContent = (row.def.sub ? '超低' : '全频') + ' ' + row.def.side;
  const readoutEl = document.createElement('div');
  readoutEl.className = 'vu-readout';
  readoutEl.innerHTML = '−∞<small>dB</small>';
  meta.append(nameEl, readoutEl);
  wrap.append(meta);

  vuView.append(wrap);

  return { needleG, readoutEl, cx, cy };
}

function createKnob(container, opts) {
  const { label, sublabel, initial = 0.5, accent = false, onChange } = opts;
  const wrap = document.createElement('div');
  wrap.className = 'knob-item' + (accent ? ' sens' : '');
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.classList.add('knob-svg');
  const outer = document.createElementNS(svgNS, 'circle');
  outer.setAttribute('cx', 50); outer.setAttribute('cy', 50); outer.setAttribute('r', 44);
  outer.setAttribute('fill', 'url(#ringGrad)');
  outer.setAttribute('stroke', 'rgba(0,0,0,.3)'); outer.setAttribute('stroke-width', '1');
  svg.append(outer);
  for (let i = 0; i < 11; i++) {
    const t = i / 10;
    const angle = -135 + 270 * t;
    const rad = (90 - angle) * Math.PI / 180;
    const r1 = 36, r2 = 41.5;
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', 50 + r1 * Math.cos(rad));
    line.setAttribute('y1', 50 - r1 * Math.sin(rad));
    line.setAttribute('x2', 50 + r2 * Math.cos(rad));
    line.setAttribute('y2', 50 - r2 * Math.sin(rad));
    line.setAttribute('class', 'knob-tick' + (i === 0 || i === 5 || i === 10 ? ' major' : ''));
    svg.append(line);
  }
  const rotor = document.createElementNS(svgNS, 'g');
  const body = document.createElementNS(svgNS, 'circle');
  body.setAttribute('cx', 50); body.setAttribute('cy', 50); body.setAttribute('r', 29);
  body.setAttribute('class', 'knob-body');
  rotor.append(body);
  const ind = document.createElementNS(svgNS, 'line');
  ind.setAttribute('x1', 50); ind.setAttribute('y1', 24);
  ind.setAttribute('x2', 50); ind.setAttribute('y2', 41);
  ind.setAttribute('class', 'knob-indicator');
  rotor.append(ind);
  svg.append(rotor);
  const cap = document.createElementNS(svgNS, 'circle');
  cap.setAttribute('cx', 50); cap.setAttribute('cy', 50); cap.setAttribute('r', 9);
  cap.setAttribute('class', 'knob-cap');
  svg.append(cap);
  wrap.append(svg);
  const labelEl = document.createElement('div');
  labelEl.className = 'knob-label';
  labelEl.innerHTML = `<span class="knob-name">${label}</span>` +
    (sublabel ? `<span class="knob-sub">${sublabel}</span>` : '');
  wrap.append(labelEl);
  const valueInput = document.createElement('input');
  valueInput.className = 'knob-input';
  valueInput.type = 'text'; valueInput.inputMode = 'decimal';
  valueInput.autocomplete = 'off'; valueInput.spellcheck = false;
  wrap.append(valueInput);
  container.append(wrap);
  let value = initial;
  function render() {
    const angle = -135 + 270 * value;
    rotor.setAttribute('transform', `rotate(${angle}, 50, 50)`);
    if (document.activeElement !== valueInput) {
      valueInput.value = fmtDb(knobToDb(value));
    }
  }
  render();
  function parseInput(s) {
    if (typeof s !== 'string') return null;
    s = s.trim().replace(/db/gi, '').trim();
    if (!s) return null;
    const v = parseFloat(s);
    if (!isFinite(v)) return null;
    return Math.max(-40, Math.min(10, v));
  }
  valueInput.addEventListener('blur', () => {
    const dB = parseInput(valueInput.value);
    if (dB === null) { render(); return; }
    const newVal = dbToKnob(dB);
    const changed = Math.abs(newVal - value) > 1e-6;
    value = newVal; render();
    valueInput.value = fmtDb(knobToDb(value));
    if (changed) onChange(value);
  });
  valueInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); valueInput.blur(); }
    else if (e.key === 'Escape') { e.preventDefault(); render(); valueInput.blur(); }
  });
  let dragging = false, lastAngle = 0;
  function getAngle(e) {
    const r = svg.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
  }
  svg.addEventListener('pointerdown', e => {
    e.preventDefault();
    svg.setPointerCapture(e.pointerId);
    dragging = true; lastAngle = getAngle(e);
    svg.classList.add('dragging');
  });
  svg.addEventListener('pointermove', e => {
    if (!dragging) return;
    const a = getAngle(e);
    let d = a - lastAngle;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    lastAngle = a;
    value = Math.max(0, Math.min(1, value + d / 270));
    render(); onChange(value);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    svg.classList.remove('dragging');
    try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const d = e.deltaY > 0 ? -1 : 1;
    value = Math.max(0, Math.min(1, value + d * 0.025));
    render(); onChange(value);
  }, { passive: false });
  svg.addEventListener('dblclick', e => {
    e.preventDefault();
    value = 0.5; render(); onChange(value);
  });
}

function setCrossoverFrequency(freq) {
  freq = Math.max(20, Math.min(1000, freq));
  crossoverFreq = freq;
  if (ctx && crossoverFilters.length > 0) {
    const t = ctx.currentTime;
    for (const filt of crossoverFilters) {
      for (const f of filt.hp) f.frequency.setTargetAtTime(freq, t, 0.03);
      for (const f of filt.lp) f.frequency.setTargetAtTime(freq, t, 0.03);
    }
  }
}

function ensureAudio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaElementSource(audio);
    const splitter = ctx.createChannelSplitter(2);
    const merger = ctx.createChannelMerger(2);
    src.connect(splitter);
    analysers = []; buffers = []; gainNodes = []; crossoverFilters = [];
    for (let ch = 0; ch < 2; ch++) {
      const hp1 = ctx.createBiquadFilter();
      hp1.type = 'highpass'; hp1.frequency.value = crossoverFreq; hp1.Q.value = 0.707;
      const hp2 = ctx.createBiquadFilter();
      hp2.type = 'highpass'; hp2.frequency.value = crossoverFreq; hp2.Q.value = 0.707;
      const aFull = ctx.createAnalyser();
      aFull.fftSize = 2048; aFull.smoothingTimeConstant = 0;
      const gFull = ctx.createGain();
      gFull.gain.value = knobToGain(gainState.full[ch]);
      splitter.connect(hp1, ch); hp1.connect(hp2); hp2.connect(aFull);
      aFull.connect(gFull); gFull.connect(merger, 0, ch);
      const lp1 = ctx.createBiquadFilter();
      lp1.type = 'lowpass'; lp1.frequency.value = crossoverFreq; lp1.Q.value = 0.707;
      const lp2 = ctx.createBiquadFilter();
      lp2.type = 'lowpass'; lp2.frequency.value = crossoverFreq; lp2.Q.value = 0.707;
      const aSub = ctx.createAnalyser();
      aSub.fftSize = 2048; aSub.smoothingTimeConstant = 0;
      const gSub = ctx.createGain();
      gSub.gain.value = knobToGain(gainState.sub[ch]);
      splitter.connect(lp1, ch); lp1.connect(lp2); lp2.connect(aSub);
      aSub.connect(gSub); gSub.connect(merger, 0, ch);
      analysers.push({ full: aFull, sub: aSub });
      buffers.push({
        full: new Float32Array(aFull.fftSize),
        sub:  new Float32Array(aSub.fftSize),
      });
      gainNodes.push({ full: gFull, sub: gSub });
      crossoverFilters.push({ hp: [hp1, hp2], lp: [lp1, lp2] });
    }
    merger.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
}

function formatWatt(v) {
  v = safeNum(v, 0);
  if (v < 0.05) return { text: '0.0', unit: 'W' };
  if (v < 10)   return { text: v.toFixed(2), unit: 'W' };
  if (v < 1000) return { text: v.toFixed(v < 100 ? 1 : 0), unit: 'W' };
  return { text: (v / 1000).toFixed(2), unit: 'kW' };
}

function calcSPL(powerW, sens, distance) {
  if (powerW < 0.01 || !sens) return null;
  return sens + 10 * Math.log10(powerW) - 20 * Math.log10(distance);
}
function updateSplCell(cell, powerW, sens, distance) {
  const valEl = cell.querySelector('.spl-val');
  const spl = calcSPL(powerW, sens, distance);
  if (spl === null || !isFinite(spl)) {
    if (valEl.dataset.v !== 'idle') {
      valEl.dataset.v = 'idle'; valEl.innerHTML = '—';
      cell.classList.remove('loud', 'danger');
    }
    return;
  }
  const text = spl.toFixed(0);
  if (valEl.dataset.v !== text) {
    valEl.dataset.v = text;
    valEl.innerHTML = text + '<small>dB</small>';
  }
  if (spl >= 112)      cell.className = 'spl-cell danger';
  else if (spl >= 105) cell.className = 'spl-cell loud';
  else                 cell.className = 'spl-cell';
}

function updateMainsDisplay(totalConW, dt) {
  if (typeof totalConW !== 'number' || !isFinite(totalConW) || totalConW < 0) totalConW = 0;
  const perPhaseW = totalConW / 3;
  const k = safeK(dt, 150);
  for (let i = 0; i < 3; i++) {
    const p = mainsPhases[i];
    const cell = mainsCells[i];
    p.volt = safeVolt(p.volt);
    const targetAmp = (perPhaseW * p.loadBias) / (p.volt * MAINS_PF);
    if (isFinite(targetAmp) && targetAmp >= 0 && k > 0) {
      mainsAmps[i] += (targetAmp - mainsAmps[i]) * k;
      if (!isFinite(mainsAmps[i]) || mainsAmps[i] < 0) mainsAmps[i] = 0;
    }
    let voltText;
    if (isFinite(p.volt)) voltText = p.volt.toFixed(1);
    else { p.volt = MAINS_NOMINAL; voltText = MAINS_NOMINAL.toFixed(1); }
    if (cell.voltEl.dataset.v !== voltText) {
      cell.voltEl.dataset.v = voltText;
      cell.voltEl.innerHTML = voltText + '<small>V</small>';
    }
    let vCls = '';
    if (p.volt < 224)      vCls = 'warn';
    else if (p.volt > 250) vCls = 'hot';
    cell.voltEl.className = 'mc-volt' + (vCls ? ' ' + vCls : '');
    const a = safeNum(mainsAmps[i], 0);
    let ampText;
    if (a < 0.005)     ampText = '0.00';
    else if (a < 1)    ampText = a.toFixed(3);
    else if (a < 10)   ampText = a.toFixed(2);
    else               ampText = a.toFixed(1);
    if (cell.ampEl.dataset.v !== ampText) {
      cell.ampEl.dataset.v = ampText;
      cell.ampEl.innerHTML = ampText + '<small>A</small>';
    }
  }
}

function updateTotalLoad(now) {
  if (!isFinite(now)) return;
  if (now - lastLoadUpdate < LOAD_REFRESH_MS) return;
  const loadDt = (lastLoadUpdate === 0 || !isFinite(lastLoadUpdate))
    ? 16 : safeDt(now - lastLoadUpdate, 200);
  lastLoadUpdate = now;
  const loads = rows.map(r => safeNum((r.powerSmooth / r.preset.maxW) * 100, 0));
  const maxLoad = loads.length ? Math.max(...loads) : 0;
  const avgLoad = loads.length ? loads.reduce((a, b) => a + b, 0) / loads.length : 0;
  const rawLoad = safeNum(maxLoad * 0.55 + avgLoad * 0.45, 0);
  const k = safeK(loadDt, 180);
  if (k > 0) {
    totalLoadSmooth += (rawLoad - totalLoadSmooth) * k;
    if (!isFinite(totalLoadSmooth) || totalLoadSmooth < 0) totalLoadSmooth = 0;
  }
  const text = totalLoadSmooth.toFixed(1);
  if (totalLoadVal.dataset.v !== text) {
    totalLoadVal.dataset.v = text;
    totalLoadVal.innerHTML = text + '<small>%</small>';
  }
  const over = totalLoadSmooth > 100;
  let cls;
  if (over) cls = 'clip';
  else if (totalLoadSmooth > 85) cls = 'hot';
  else if (totalLoadSmooth > 70) cls = 'warn';
  else cls = '';
  totalLoadVal.className = 'sys-value' + (cls ? ' ' + cls : '');
  let barCls;
  if (over) barCls = 'clip';
  else if (totalLoadSmooth > 85) barCls = 'hot';
  else if (totalLoadSmooth > 70) barCls = 'warn';
  else barCls = '';
  totalLoadFill.className = 'sys-fill' + (barCls ? ' ' + barCls : '');
  totalLoadFill.style.width = Math.min(Math.max(totalLoadSmooth, 0), 100).toFixed(1) + '%';
}

const powerHistory = new Float32Array(ENERGY_HISTORY);
let historyHead = 0, historyCount = 0;
let historyLastSample = performance.now();
if (!isFinite(historyLastSample)) historyLastSample = Date.now();
let totalEnergyKWh = 0, totalSum = 0, totalCount = 0;
let energyStartTime = performance.now();
if (!isFinite(energyStartTime)) energyStartTime = Date.now();
let lastEnergyDisplay = 0;

const energyKWhEl     = document.getElementById('energyKWh');
const energyRuntimeEl = document.getElementById('energyRuntime');
const avgValueEl      = document.getElementById('avgValue');
const avgUnitEl       = document.getElementById('avgUnit');
const avgSelect       = document.getElementById('avgSelect');
const resetEnergyBtn  = document.getElementById('resetEnergyBtn');

function pushSample(v) {
  v = safeNum(v, 0);
  if (v < 0) v = 0;
  powerHistory[historyHead] = v;
  historyHead = (historyHead + 1) % ENERGY_HISTORY;
  if (historyCount < ENERGY_HISTORY) historyCount++;
}
function avgRecent(n) {
  const cnt = Math.min(n, historyCount);
  if (cnt === 0) return null;
  let sum = 0;
  for (let i = 0; i < cnt; i++) {
    const idx = (historyHead - 1 - i + ENERGY_HISTORY * 2) % ENERGY_HISTORY;
    const v = powerHistory[idx];
    if (isFinite(v)) sum += v;
  }
  const avg = sum / cnt;
  return isFinite(avg) ? avg : null;
}
function resetEnergy() {
  totalEnergyKWh = 0; totalSum = 0; totalCount = 0;
  historyHead = 0; historyCount = 0;
  const now = performance.now();
  historyLastSample = isFinite(now) ? now : Date.now();
  energyStartTime = historyLastSample;
  lastEnergyDisplay = 0;
}
function updateEnergy(now, dtMs) {
  if (!isFinite(now)) return;
  const dtSec = safeDt(dtMs, 1000) / 1000;
  const p = safeNum(totalConSmooth, 0);
  totalEnergyKWh += p * dtSec / 3600000;
  if (!isFinite(totalEnergyKWh) || totalEnergyKWh < 0) totalEnergyKWh = 0;
  if (!isFinite(historyLastSample)) historyLastSample = now;
  let guard = 0;
  while (now - historyLastSample >= ENERGY_SAMPLE_MS && guard < 100) {
    historyLastSample += ENERGY_SAMPLE_MS;
    pushSample(totalConSmooth);
    totalSum += safeNum(totalConSmooth, 0);
    totalCount++;
    guard++;
  }
  if (guard >= 100) historyLastSample = now;
  if (!isFinite(totalSum) || totalSum < 0) totalSum = 0;
  if (!isFinite(totalCount) || totalCount < 0) totalCount = 0;
}
function fmtEnergy(kwh) {
  if (!isFinite(kwh) || kwh < 0) return '0.000';
  if (kwh < 0.001) return '0.000';
  if (kwh < 1)     return kwh.toFixed(3);
  if (kwh < 100)   return kwh.toFixed(2);
  return Math.round(kwh).toString();
}
function fmtRuntime(ms) {
  if (!isFinite(ms) || ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function getSelectedAvg() {
  switch (avgSelect.value) {
    case '10m': return avgRecent(2400);
    case '5m':  return avgRecent(1200);
    case '30s': return avgRecent(120);
    case '5s':  return avgRecent(20);
    case 'since':
    default: {
      if (totalCount <= 0) return null;
      const avg = totalSum / totalCount;
      return isFinite(avg) ? avg : null;
    }
  }
}
function updateEnergyDisplay(now) {
  if (!isFinite(now)) return;
  const kwhText = fmtEnergy(totalEnergyKWh);
  if (energyKWhEl.dataset.v !== kwhText) {
    energyKWhEl.dataset.v = kwhText; energyKWhEl.textContent = kwhText;
  }
  const rtText = fmtRuntime(now - energyStartTime);
  if (energyRuntimeEl.dataset.v !== rtText) {
    energyRuntimeEl.dataset.v = rtText; energyRuntimeEl.textContent = rtText;
  }
  const val = getSelectedAvg();
  if (val == null || !isFinite(val)) {
    if (avgValueEl.dataset.v !== 'idle') {
      avgValueEl.dataset.v = 'idle';
      avgValueEl.textContent = '—'; avgUnitEl.textContent = '';
    }
    return;
  }
  let numText, unitText;
  if (val < 1) { numText = val.toFixed(1); unitText = 'W'; }
  else if (val < 1000) { numText = Math.round(val).toString(); unitText = 'W'; }
  else { numText = (val / 1000).toFixed(2); unitText = 'kW'; }
  const tag = numText + '|' + unitText;
  if (avgValueEl.dataset.v !== tag) {
    avgValueEl.dataset.v = tag;
    avgValueEl.textContent = numText;
    avgUnitEl.textContent = unitText;
  }
}

resetEnergyBtn.addEventListener('click', () => {

let lastT = null;
function fmtTime(t) {
  if (!isFinite(t) || t < 0) return '--:--';
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}
function readPeak(analyser, buf) {
  analyser.getFloatTimeDomainData(buf);
  let p = 0;
  for (let i = 0; i < buf.length; i++) {
    const v = buf[i] < 0 ? -buf[i] : buf[i];
    if (v > p) p = v;
  }
  return p;
}
function dbToVUAngle(db) {
  const clamped = Math.max(VU_MIN_DB, Math.min(VU_MAX_DB, db));
  const norm = (clamped - VU_MIN_DB) / (VU_MAX_DB - VU_MIN_DB);
  return VU_START + norm * VU_SWEEP;
}

function frame(now) {
  requestAnimationFrame(frame);
  if (typeof now !== 'number' || !isFinite(now)) return;
  if (lastT === null || !isFinite(lastT)) { lastT = now; return; }

  const dt = safeDt(now - lastT, 100);
  lastT = now;

  const running = ctx && ctx.state === 'running';
  const intervalMs = REFRESH_MODES[refreshMode].intervalMs;
  const doDisplay  = intervalMs === 0 || (now - lastDisplayUpdate >= intervalMs);

  let displayDt = 0;
  if (doDisplay) {
    displayDt = (lastDisplayUpdate === 0 || !isFinite(lastDisplayUpdate))
      ? 16 : safeDt(now - lastDisplayUpdate, 300);
    lastDisplayUpdate = now;
  }

  stepMainsVoltage(dt);

  const isVUMode = document.body.classList.contains('meter-vu');

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const { band, ch } = row.def;

    let rawPeak = 0;
    if (running) rawPeak = readPeak(analysers[ch][band], buffers[ch][band]);
    rawPeak = safeNum(rawPeak, 0);

    const targetKnob = safeNum(knobToGain(gainState[band][ch]), 1);
    const knobK = safeK(dt, 20);
    if (knobK > 0) {
      smoothKnobGain[band][ch] += (targetKnob - smoothKnobGain[band][ch]) * knobK;
      if (!isFinite(smoothKnobGain[band][ch]) || smoothKnobGain[band][ch] < 0) {
        smoothKnobGain[band][ch] = targetKnob;
      }
    }
    const knobGain = smoothKnobGain[band][ch];

    const maxW = row.preset.maxW;
    const limitPct = limitState[band][ch];
    const limitPower = maxW * (limitPct / 100);

    const demandPeak  = rawPeak * knobGain;
    const demandPower = maxW * demandPeak * demandPeak;

    let targetLim = 1;
    if (demandPower > limitPower && rawPeak > 1e-9 && knobGain > 1e-9) {
      const neededOutPeak = Math.sqrt(limitPower / maxW);
      const neededTotalGain = neededOutPeak / rawPeak;
      const candidate = neededTotalGain / knobGain;
      if (isFinite(candidate)) targetLim = Math.max(0, Math.min(1, candidate));
    }

    const attacking = targetLim < limiterGain[band][ch];
    const tauMs = attacking ? 5 : 250;
    const limK = safeK(dt, tauMs);
    if (limK > 0) {
      limiterGain[band][ch] += (targetLim - limiterGain[band][ch]) * limK;
      if (!isFinite(limiterGain[band][ch]) || limiterGain[band][ch] < 0) {
        limiterGain[band][ch] = targetLim;
      }
    }

    const totalGain = knobGain * limiterGain[band][ch];
    if (gainNodes[ch] && gainNodes[ch][band]) {
      gainNodes[ch][band].gain.value = safeNum(totalGain, 1);
    }

    const rawOutPeak = rawPeak * totalGain;
    if (rawOutPeak >= CLIP_LEVEL) row.clipUntil = now + CLIP_HOLD;

    if (doDisplay) {
      const displayPeak = Math.max(rawOutPeak, row.peakAccum);
      row.peakAccum = 0;

      const outPeak = Math.min(displayPeak, 1.0);
      const dbfs = 20 * Math.log10(outPeak + 1e-12);
      const ref = BASE_REF[band] + sensOffset;
      const meterDb = dbfs - ref;

      if (meterDb >= row.db) {
        row.db = meterDb;
      } else {
        const k = safeK(displayDt, RELEASE_MS);
        if (k > 0) {
          row.db += (meterDb - row.db) * k;
          if (!isFinite(row.db)) row.db = meterDb;
        }
      }
      if (!isFinite(row.db) || row.db < -70) row.db = Math.max(-70, safeNum(row.db, -70));

      const clipOn = now < row.clipUntil;

      /* ★ LED 更新：off → on 时触发一次亮度脉冲 */
      for (const led of row.leds) {
        const on = led.clip ? clipOn : (row.db >= led.db);
        if (on !== led.on) {
          led.on = on;
          led.el.classList.toggle('on', on);
          if (on) {
            /* 先移除 pop 类并强制回流，再添加，让动画重启 */
            led.el.classList.remove('pop');
            void led.el.offsetWidth;
            led.el.classList.add('pop');
          } else {
            led.el.classList.remove('pop');
          }
        }
      }

      let txt;
      if (row.db <= -59.95) txt = '−∞';
      else txt = (row.db >= 0 ? '+' : '−') + Math.abs(row.db).toFixed(1);
      if (row.dbEl.textContent !== txt) row.dbEl.textContent = txt;
      row.dbEl.classList.toggle('hot', row.db >= 0 && !clipOn);
      row.dbEl.classList.toggle('clip', clipOn);

      if (isVUMode) {
        const vu = vuMeters[i];
        const angle = dbToVUAngle(row.db);
        vu.needleG.setAttribute('transform', `rotate(${angle}, ${vu.cx}, ${vu.cy})`);
        let vutxt;
        if (row.db <= -59.95) vutxt = '−∞';
        else vutxt = (row.db >= 0 ? '+' : '−') + Math.abs(row.db).toFixed(1);
        const html = vutxt + '<small>dB</small>';
        if (vu.readoutEl.dataset.v !== html) {
          vu.readoutEl.dataset.v = html;
          vu.readoutEl.innerHTML = html;
        }
        vu.readoutEl.classList.toggle('hot', row.db >= 0 && !clipOn);
        vu.readoutEl.classList.toggle('clip', clipOn);
      }

      const pFactor = Math.min(displayPeak * displayPeak, 1.44);
      const powerRaw = maxW * pFactor;
      const pk = safeK(displayDt, 160);
      if (pk > 0) {
        row.powerSmooth += (powerRaw - row.powerSmooth) * pk;
        if (!isFinite(row.powerSmooth) || row.powerSmooth < 0) row.powerSmooth = 0;
      }

      const card = powerCards[i];
      if (card) {
        const watts = row.powerSmooth < 0.05 ? 0 : row.powerSmooth;
        let display;
        if (watts === 0)          display = '0.0';
        else if (watts < 10)      display = watts.toFixed(2);
        else if (watts < 100)     display = watts.toFixed(1);
        else                      display = Math.round(watts).toString();
        if (card.valueEl.dataset.v !== display) {
          card.valueEl.dataset.v = display;
          card.valueEl.innerHTML = display + '<small>W</small>';
        }
        const pct = pFactor * 100;
        const overLoad = pct > 100;
        let cls;
        if (overLoad) cls = 'clip';
        else if (pct > 75) cls = 'hot';
        else if (pct > 45) cls = 'warn';
        else cls = '';
        card.valueEl.className = 'pc-value' + (cls ? ' ' + cls : '');
        card.fillEl.className = 'pc-fill' + (cls ? ' ' + cls : '');
        card.fillEl.style.width = Math.min(pct / 1.2, 100).toFixed(1) + '%';
        const pctText = pct.toFixed(1) + '%';
        if (card.pctEl.textContent !== pctText) card.pctEl.textContent = pctText;
        let pctCls;
        if (overLoad) pctCls = 'clip';
        else if (pct > 90) pctCls = 'hot';
        else if (pct > 75) pctCls = 'warn';
        else pctCls = '';
        card.pctEl.className = 'pc-pct' + (pctCls ? ' ' + pctCls : '');
        const limVal = parseFloat(card.limInput.value);
        card.limInput.classList.toggle('warn', isFinite(limVal) && limVal > 100);
        const preset = row.preset;
        if (preset.custom || !preset.sens) {
          card.splEl.classList.add('hidden');
        } else {
          card.splEl.classList.remove('hidden');
          updateSplCell(card.spl1mCell,    row.powerSmooth, preset.sens, 1);
          updateSplCell(card.splFrontCell, row.powerSmooth, preset.sens, preset.distFront);
          updateSplCell(card.splBackCell,  row.powerSmooth, preset.sens, preset.distBack);
        }
      }
    } else {
      if (rawOutPeak > row.peakAccum) row.peakAccum = rawOutPeak;
    }
  }

  if (doDisplay) {
    let rawTotalOut = 0;
    let rawTotalCon = 0;
    for (const r of rows) {
      const o = safeNum(r.powerSmooth, 0);
      rawTotalOut += o;
      rawTotalCon += safeNum(channelConsumedW(o, r.preset.maxW, ampClass), 0);
    }
    const sysK = safeK(displayDt, 200);
    if (sysK > 0) {
      totalOutSmooth += (rawTotalOut - totalOutSmooth) * sysK;
      totalConSmooth += (rawTotalCon - totalConSmooth) * sysK;
      if (!isFinite(totalOutSmooth) || totalOutSmooth < 0) totalOutSmooth = 0;
      if (!isFinite(totalConSmooth) || totalConSmooth < 0) totalConSmooth = 0;
    }
    const oFmt = formatWatt(totalOutSmooth);
    if (totalOutVal.dataset.v !== oFmt.text + oFmt.unit) {
      totalOutVal.dataset.v = oFmt.text + oFmt.unit;
      totalOutVal.innerHTML = oFmt.text + '<small>' + oFmt.unit + '</small>';
    }
    const cFmt = formatWatt(totalConSmooth);
    if (totalConVal.dataset.v !== cFmt.text + cFmt.unit) {
      totalConVal.dataset.v = cFmt.text + cFmt.unit;
      totalConVal.innerHTML = cFmt.text + '<small>' + cFmt.unit + '</small>';
    }
    const effPct = totalOutSmooth < 0.5
      ? 0
      : Math.min((totalOutSmooth / Math.max(totalConSmooth, 1e-6)) * 100, 100);
    const effText = effPct.toFixed(1);
    if (effVal.dataset.v !== effText) {
      effVal.dataset.v = effText;
      effVal.innerHTML = effText + '<small>%</small>';
    }
    let effCls = '';
    if (effPct === 0) effCls = 'idle';
    else if (effPct < 50) effCls = 'warn';
    else if (effPct < 80) effCls = 'hot';
    else effCls = '';
    effVal.className = 'sys-value' + (effCls ? ' ' + effCls : '');
    const fillCls = effCls === 'idle' ? '' : effCls;
    effFill.className = 'sys-fill' + (fillCls ? ' ' + fillCls : '');
    effFill.style.width = effPct.toFixed(1) + '%';
    updateMainsDisplay(totalConSmooth, displayDt);
    updateEnergy(now, displayDt);
  }

  updateTotalLoad(now);

  if (now - lastEnergyDisplay >= ENERGY_DISPLAY_MS) {
    lastEnergyDisplay = now;
    updateEnergyDisplay(now);
  }

  if (isFinite(audio.duration) && audio.duration > 0) {
    timeEl.textContent = `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration)}`;
  } else if (audio.src) {
    timeEl.textContent = `${fmtTime(audio.currentTime)} / --:--`;
  }
}

requestAnimationFrame(frame);

(function injectVUGradients(){
  const svgNS = 'http://www.w3.org/2000/svg';
  const defsSvg = document.createElementNS(svgNS, 'svg');
  defsSvg.setAttribute('width', '0');
  defsSvg.setAttribute('height', '0');
  defsSvg.style.position = 'absolute';
  const defs = document.createElementNS(svgNS, 'defs');
  const faceGrad = document.createElementNS(svgNS, 'linearGradient');
  faceGrad.setAttribute('id', 'vuFaceGrad');
  faceGrad.setAttribute('x1', '0'); faceGrad.setAttribute('y1', '0');
  faceGrad.setAttribute('x2', '0'); faceGrad.setAttribute('y2', '1');
  const f1 = document.createElementNS(svgNS, 'stop');
  f1.setAttribute('offset', '0%');  f1.setAttribute('stop-color', 'var(--vu-face-1)');
  const f2 = document.createElementNS(svgNS, 'stop');
  f2.setAttribute('offset', '100%'); f2.setAttribute('stop-color', 'var(--vu-face-2)');
  faceGrad.append(f1, f2);
  defs.append(faceGrad);
  const hubGrad = document.createElementNS(svgNS, 'radialGradient');
  hubGrad.setAttribute('id', 'vuHubGrad');
  hubGrad.setAttribute('cx', '38%'); hubGrad.setAttribute('cy', '32%');
  hubGrad.setAttribute('r', '80%');
  const h1 = document.createElementNS(svgNS, 'stop');
  h1.setAttribute('offset', '0%');   h1.setAttribute('stop-color', 'var(--vu-hub-1)');
  const h2 = document.createElementNS(svgNS, 'stop');
  h2.setAttribute('offset', '100%'); h2.setAttribute('stop-color', 'var(--vu-hub-2)');
  hubGrad.append(h1, h2);
  defs.append(hubGrad);
  defsSvg.append(defs);
  document.body.append(defsSvg);
})();
</script>
